name: Generar Informe Semanal UCIN

on:
  schedule:
    # 11:17 UTC = 08:17 AM Córdoba (UTC-3).
    - cron: '17 11 * * 1'
  
  workflow_dispatch:

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema operativo (Requisito de Weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pango1.0-tools libpango-1.0-0 libpangocairo-1.0-0

      - name: Instalar librerías de Python
        run: pip install -r requirements.txt

      - name: Ejecutar script y enviar PDF por correo
        env:
          INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python informe.py
